<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, initial-scale=0.38">
    <title>Invitación Cassey Nalani 🍓</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --fresa: #e63946; --rosa-fucsia: #ff1493; }
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Quicksand', sans-serif; background: url('fondo.jpg') no-repeat center center fixed; background-size: cover; background-color: #ffe5ec; overflow: hidden; }
        .brillo { position: absolute; background: white; border-radius: 50%; opacity: 0.6; pointer-events: none; animation: parpadeo linear infinite; }
        @keyframes parpadeo { 0%, 100% { opacity: 0; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.5); } }
        @keyframes heartbeatSuave { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        #overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255, 179, 193, 0.98); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; text-align: center; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.88); width: 400px; border-radius: 40px; border: 5px solid white; text-align: center; padding: 20px 0; box-shadow: 0 15px 35px rgba(0,0,0,0.2); display: none; backdrop-filter: blur(12px); animation: slideUp 1s ease-out; position: relative; z-index: 10; }
        h1 { font-family: 'Pacifico', cursive; color: var(--fresa); margin: 0; font-size: 3.2rem; text-shadow: 2px 2px 0px #fff; animation: heartbeatSuave 3s infinite ease-in-out; }
        .foto-container { width: 170px; height: 170px; margin: 15px auto; border-radius: 50%; border: 6px solid white; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.15); animation: heartbeatSuave 4s infinite ease-in-out; }
        .foto-container img { width: 100%; height: 100%; object-fit: cover; }
        .countdown-container { display: flex; justify-content: center; gap: 8px; margin: 10px 0; }
        .time-box { background: white; border: 1px solid var(--fresa); border-radius: 10px; padding: 5px; min-width: 50px; }
        .time-val { font-size: 1.1rem; font-weight: bold; color: var(--fresa); display: block; }
        .time-lab { font-size: 0.6rem; text-transform: uppercase; color: #666; }
        .te-esperamos { font-family: 'Dancing Script', cursive; color: var(--rosa-fucsia); font-size: 2.8rem; margin: 5px 0; display: block; animation: heartbeatSuave 3s infinite ease-in-out; }
        .btn { display: flex; align-items: center; justify-content: center; padding: 16px; margin: 10px 25px; border-radius: 50px; color: white; font-weight: bold; font-size: 1rem; border: none; cursor: pointer; animation: heartbeatSuave 3.5s infinite ease-in-out; }
        .particula { position: fixed; pointer-events: none; font-size: 50px; z-index: 9999; animation: volarArriba 1.2s ease-out forwards; }
        @keyframes volarArriba { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 100% { transform: translate(calc(-50% + var(--x)), calc(-100% - var(--y))) scale(1.2) rotate(var(--r)); opacity: 0; } }
    </style>
</head>
<body>
    <div id="overlay" onclick="abrirInvitacion()">
        <div style="font-family:'Pacifico'; color:white; font-size:2.2rem;">¡Tienes una invitación!</div>
        <div style="font-size:100px; animation: heartbeatSuave 2s infinite;">🍓</div>
        <div style="color:white; font-size:1.1rem;">(Toca la fresita para abrir)</div>
    </div>
    <div class="card" id="card">
        <h1>Cassey Nalani</h1>
        <div style="background:var(--fresa); color:white; display:inline-block; padding:10px 25px; border-radius:30px; font-weight:bold; font-size:1.1rem;">🍓 MI 1er AÑITO Y BAUTIZO 🍓</div>
        <div class="foto-container"><img src="niña.png" alt="Princesa" onerror="this.src='https://cdn-icons-png.flaticon.com/512/590/590685.png'"></div>
        <div class="countdown-container">
            <div class="time-box"><span class="time-val" id="days">00</span><span class="time-lab">Días</span></div>
            <div class="time-box"><span class="time-val" id="hours">00</span><span class="time-lab">Hrs</span></div>
            <div class="time-box"><span class="time-val" id="mins">00</span><span class="time-lab">Min</span></div>
            <div class="time-box"><span class="time-val" id="secs">00</span><span class="time-lab">Seg</span></div>
        </div>
        <div style="padding: 0 25px; font-size: 0.95rem;">
            <b>Mamá y Papá</b> te invitan a celebrar a la <b>Princesa del Hogar.</b>
            <span class="te-esperamos">¡Te Esperamos!</span>
            <div style="font-size:0.8rem; font-weight:bold;">PADRINO: EDUARDO LEONIDES VENTURA</div>
        </div>
        <div style="margin: 15px 25px; padding: 10px; border-radius: 20px; background: #fff5f7; border: 2px dashed var(--fresa); font-size: 0.85rem;">
            📍 <b>SALÓN EJIDAL, EL PORVENIR</b><br>
            📅 <b>SÁBADO 25 DE JULIO, 2026</b> | ⏰ 4:00 PM
        </div>
        <button onclick="lanzarExplosion(this, 'map')" class="btn" style="background: var(--fresa); width: calc(100% - 50px);">📍 VER UBICACIÓN</button>
        <button onclick="lanzarExplosion(this, 'wpp')" class="btn" style="background: var(--rosa-fucsia); width: calc(100% - 50px);">✅ CONFIRMAR ASISTENCIA</button>
        <audio id="musica" loop><source src="musica.mp3" type="audio/mpeg"></audio>
    </div>
<script>
    const fechaFiesta = new Date(2026, 6, 25, 16, 0).getTime();
    function actualizarContador() {
        const ahora = new Date().getTime();
        const diff = fechaFiesta - ahora;
        document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById('mins').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        document.getElementById('secs').innerText = Math.floor((diff % (1000 * 60)) / 1000);
    }
    setInterval(actualizarContador, 1000);
    function abrirInvitacion() { document.getElementById('overlay').style.display = 'none'; document.getElementById('card').style.display = 'block'; document.getElementById('musica').play(); crearBrillitos(); }
    function crearBrillitos() { for (let i = 0; i < 30; i++) { let b = document.createElement('div'); b.className = 'brillo'; b.style.width = '3px'; b.style.height = '3px'; b.style.left = Math.random() * 100 + 'vw'; b.style.top = Math.random() * 100 + 'vh'; b.style.animationDuration = (Math.random() * 3 + 2) + 's'; document.body.appendChild(b); } }
    function lanzarExplosion(elemento, tipo) {
        const rect = elemento.getBoundingClientRect();
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div'); p.innerHTML = '🍓'; p.className = 'particula'; p.style.left = (rect.left + rect.width / 2) + 'px'; p.style.top = (rect.top + rect.height / 2) + 'px';
            p.style.setProperty('--x', `${(Math.random() - 0.5) * 500}px`); p.style.setProperty('--y', `${Math.random() * 600 + 200}px`); p.style.setProperty('--r', `${Math.random() * 720}deg`); document.body.appendChild(p); setTimeout(() => p.remove(), 1200);
        }
        setTimeout(() => { if (tipo === 'map') window.open("https://maps.app.goo.gl/YourMapLink", "_blank"); else window.location.href = `https://wa.me/522871277851?text=¡Confirmado! Allí estaremos.`; }, 600);
    }
</script>
</body>
</html>
